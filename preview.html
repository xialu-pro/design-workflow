<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>需求文档工作流 · 预览</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f2f3f5; color: #1d2129; }
  header { position: sticky; top: 0; z-index: 100; background: #ffffff; border-bottom: 1px solid #e5e6eb; padding: 14px 32px; display: flex; align-items: center; gap: 28px; }
  .brand { font-size: 15px; font-weight: 600; white-space: nowrap; }
  .tabs { display: flex; gap: 12px; }
  .tab { padding: 10px 24px; font-size: 14px; border: 1px solid #e5e6eb; background: #fff; color: #4e5969; border-radius: 8px; cursor: pointer; transition: all .15s; }
  .tab:hover { border-color: #165dff; color: #165dff; }
  .tab.active { background: #165dff; border-color: #165dff; color: #fff; font-weight: 500; }
  main { max-width: 920px; margin: 28px auto 48px; padding: 48px 64px; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(29,33,41,.06); min-height: 400px; }
  main h1 { font-size: 26px; border-bottom: 2px solid #e5e6eb; padding-bottom: 14px; margin-top: 8px; }
  main h2 { font-size: 20px; margin-top: 40px; border-left: 4px solid #165dff; padding-left: 12px; }
  main h3 { font-size: 17px; margin-top: 28px; }
  main h4 { font-size: 15px; margin-top: 24px; }
  main p, main li { line-height: 1.75; font-size: 14.5px; }
  main table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 14px; }
  main th, main td { border: 1px solid #e5e6eb; padding: 10px 14px; text-align: left; }
  main th { background: #f7f8fa; font-weight: 600; }
  main tr:nth-child(even) td { background: #fafbfc; }
  main code { background: #f2f3f5; border-radius: 4px; padding: 2px 6px; font-size: 13px; font-family: "SF Mono", Menlo, Consolas, monospace; }
  main pre { background: #2b2f36; border-radius: 8px; padding: 20px; overflow-x: auto; }
  main pre code { background: none; padding: 0; color: inherit; font-size: 13px; line-height: 1.7; }
  main blockquote { border-left: 4px solid #165dff; background: #f7f9ff; margin: 16px 0; padding: 10px 18px; color: #4e5969; }
  .mermaid-box { text-align: center; padding: 24px; background: #fafbfc; border: 1px solid #e5e6eb; border-radius: 8px; margin: 16px 0; overflow-x: auto; }
  #loading { color: #86909c; text-align: center; padding: 80px 0; font-size: 14px; }
</style>
</head>
<body>
<header>
  <div class="brand">文档预览</div>
  <div class="tabs">
    <button class="tab active" data-src=".trae/skills/requirement-doc-generator/SKILL.md">Skill：需求文档生成器</button>
    <button class="tab" data-src="docs/PRD_openEuler社区SkillHub_20260827.md">PRD：Skill Hub</button>
  </div>
</header>
<main><div id="loading">正在加载文档…</div></main>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script>
  mermaid.initialize({ startOnLoad: false, securityLevel: 'loose' });
  let seq = 0;
  async function load(src) {
    const main = document.querySelector('main');
    main.innerHTML = '<div id="loading">正在加载文档…</div>';
    const res = await fetch(encodeURI(src));
    const md = await res.text();
    main.innerHTML = marked.parse(md);
    const blocks = Array.from(main.querySelectorAll('pre code.language-mermaid'));
    for (const el of blocks) {
      try {
        const { svg } = await mermaid.render('mmd-' + (seq++), el.textContent);
        const box = document.createElement('div');
        box.className = 'mermaid-box';
        box.innerHTML = svg;
        el.parentElement.replaceWith(box);
      } catch (e) { /* 渲染失败时保留源码展示 */ }
    }
  }
  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      load(btn.dataset.src);
    });
  });
  load(document.querySelector('.tab.active').dataset.src);
</script>
</body>
</html>
